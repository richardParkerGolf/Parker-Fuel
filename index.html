<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parker Fuel</title>
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    html,body{margin:0;min-height:100%}iframe{display:block;width:100%;min-height:100vh;border:0}
    #parker-fuel-frame{position:fixed;inset:0;z-index:99999;width:100%;height:100dvh;overflow:hidden;background:#f5f1e8}
    #parker-fuel-app{display:block;width:100%;height:100%;border:0;background:#f5f1e8}
  </style>
</head>
<body>
  <div id="parker-fuel-frame"><iframe id="parker-fuel-app" title="Parker Fuel" allow="clipboard-write" referrerpolicy="no-referrer"></iframe></div>
  <script>
    (() => {
      const APPS_SCRIPT_EXEC_URL = 'https://script.google.com/macros/s/AKfycbzKlzuj4O5M-eTLDUXixI62IFXMor2_S1aPxGCoW6sx6jOGCuoJMKMYhR9cr2nfXL6X/exec';
      const frame = document.getElementById('parker-fuel-app');
      function openFuel() { frame.src = APPS_SCRIPT_EXEC_URL + (window.location.search || '') + (window.location.hash || ''); }
      openFuel();
      window.addEventListener('hashchange', openFuel);
      window.addEventListener('popstate', openFuel);
    })();
  </script>
</body>
</html>
